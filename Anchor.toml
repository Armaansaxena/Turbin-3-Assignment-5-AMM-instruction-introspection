[toolchain]
anchor_version = "0.31.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
amm = "2AixtNQtF9kMe3n4GmUAXnWSqkrfGZyEazexwytCbuw8"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
startup_wait = 40000

[test.validator]
bind_address = "127.0.0.1"
gossip_port = 8001

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
