[package]
name = "amm"
version = "0.1.0"
description = "Automated Market Maker (AMM) program built with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "amm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"

[dev-dependencies]
anchor-lang = { version = "0.31.0", features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [] }
